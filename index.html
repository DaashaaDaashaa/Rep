<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Репетитор — Журнал</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #FDF5F8;
    --surface:   #FFFFFF;
    --border:    #F2E3EB;
    --blue:      #8A4866;
    --indigo:    #BD5085;
    --indigo-lt: #FBEEF4;
    --amber:     #BC4D83;
    --amber-lt:  #FCEFF6;
    --green:     #7CC2A0;
    --green-lt:  #EFF9F4;
    --red:       #E08A8A;
    --red-lt:    #FCF1F1;
    --text:      #7A4A5C;
    --muted:     #A0576E;
    --radius:    14px;
    --shadow:    0 2px 14px rgba(204,107,150,.08);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LOGIN SCREEN ── */
  #loginScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  #loginScreen.hidden { display: none; }
  .login-card {
    background: var(--surface);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(122,74,92,.15);
    padding: 44px 40px;
    width: 100%; max-width: 380px;
    text-align: center;
  }
  .login-logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800; font-size: 26px;
    color: var(--blue); margin-bottom: 6px;
  }
  .login-logo span { color: var(--indigo); }
  .login-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 32px; }
  .login-label {
    display: block; text-align: left;
    font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .login-input {
    width: 100%; border: 1.5px solid var(--border);
    border-radius: 10px; padding: 11px 14px;
    font-size: 15px; font-family: 'Inter', sans-serif;
    outline: none; background: var(--bg); color: var(--text);
    transition: border-color .15s; margin-bottom: 16px;
  }
  .login-input:focus { border-color: var(--indigo); }
  .login-btn {
    width: 100%; background: var(--indigo); color: #fff;
    border: none; border-radius: 10px;
    padding: 13px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: 'Inter', sans-serif;
    transition: background .15s; margin-top: 4px;
  }
  .login-btn:hover { background: var(--blue); }
  .login-error {
    background: var(--red-lt); color: var(--red);
    border-radius: 8px; padding: 10px 14px;
    font-size: 13px; font-weight: 600;
    margin-bottom: 14px; display: none;
  }
  .login-error.show { display: block; }
  .login-hint { font-size: 12px; color: var(--muted); margin-top: 20px; }

  /* hide app until logged in */
  #appRoot { display: none; }
  #appRoot.visible { display: contents; }

  /* ── TOP BAR ── */
  header {
    background: var(--blue);
    padding: 0 32px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 10px rgba(122,74,92,.15);
  }
  .logo-row { display: flex; align-items: center; gap: 18px; }
  .logo {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: #fff;
    letter-spacing: -.3px;
  }
  .logo span { color: #FFD6E8; }
  .header-home-btn {
    background: rgba(255,255,255,.14);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background .15s;
  }
  .header-home-btn:hover { background: rgba(255,255,255,.24); }
  .header-home-btn.nav-active { background: rgba(255,255,255,.28); box-shadow: 0 0 0 1.5px rgba(255,255,255,.5); }

  /* ── SCHEDULE GRID ── */
  .schedule-view { padding: 0; overflow: auto; height: 100%; }
  .schedule-view > h2 { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 14px; padding-top: 4px; }
  .schedule-grid-wrap { overflow: auto; border-radius: var(--radius); box-shadow: var(--shadow); background: var(--surface); max-height: calc(100vh - 200px); }
  .schedule-grid { display: grid; grid-template-columns: 58px repeat(7, 1fr); min-width: 640px; }
  .sg-corner, .sg-day-header { background: var(--blue); color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; text-align: center; padding: 12px 6px; position: sticky; top: 0; z-index: 3; }
  .sg-corner { z-index: 4; border-radius: var(--radius) 0 0 0; }
  .sg-day-header:last-child { border-radius: 0 var(--radius) 0 0; }
  .sg-day-header.today { background: var(--indigo); }
  .sg-time { font-size: 11px; font-weight: 600; color: var(--muted); text-align: right; padding: 3px 8px 0 4px; position: sticky; left: 0; background: var(--surface); z-index: 2; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; white-space: nowrap; line-height: 1; }
  .sg-time.hour-mark { font-weight: 700; color: var(--text); font-size: 12px; }
  .sg-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 22px; height: 22px; position: relative; transition: background .1s; }
  .sg-cell:last-child { border-right: none; }
  .sg-cell.hour-mark { border-bottom-color: #e0ccd6; }
  .sg-cell.today-col { background: #fdf5f8; }
  .sg-lesson { position: absolute; inset: 1px 2px; border-radius: 6px; padding: 3px 6px 3px 4px; display: flex; align-items: center; gap: 5px; overflow: hidden; cursor: default; z-index: 1; transition: filter .12s; }
  .sg-lesson:hover { filter: brightness(.93); }
  .sg-lesson-name { font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; cursor: pointer; }
  .sg-lesson-time { font-size: 10px; color: rgba(255,255,255,.8); white-space: nowrap; flex-shrink: 0; }

  /* prep checkbox */
  .sg-prep-check {
    flex-shrink: 0;
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 2px solid rgba(255,255,255,.6);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
    position: relative;
  }
  .sg-prep-check.checked {
    background: rgba(255,255,255,.9);
    border-color: rgba(255,255,255,.9);
  }
  .sg-prep-check.checked::after {
    content: '';
    display: block;
    width: 8px; height: 5px;
    border-left: 2px solid #6B1437;
    border-bottom: 2px solid #6B1437;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .sg-prep-check:hover:not(.checked) { border-color: #fff; background: rgba(255,255,255,.2); }

  /* prep reset button */
  .prep-reset-btn {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color .15s, color .15s;
  }
  .prep-reset-btn:hover { border-color: var(--red); color: var(--red); }
  .schedule-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .header-date {
    font-size: 13px;
    color: rgba(255,255,255,.55);
  }

  /* ── LAYOUT ── */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 62px);
  }

  /* ── SIDEBAR ── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 8px 8px;
  }
  .student-card {
    border-radius: var(--radius);
    padding: 12px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background .15s, box-shadow .15s;
    border: 1.5px solid transparent;
  }
  .student-card:hover { background: var(--indigo-lt); }
  .student-card.active {
    background: var(--indigo-lt);
    border-color: var(--indigo);
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
    color: var(--text);
  }
  .student-info { flex: 1; min-width: 0; }
  .student-name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .student-subject {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  /* ring */
  .ring-wrap { flex-shrink: 0; }
  .ring-wrap svg { display: block; }

  .btn-add-student {
    margin-top: 8px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    background: none;
    padding: 10px;
    color: var(--indigo);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    font-family: 'Inter', sans-serif;
    width: 100%;
  }
  .btn-add-student:hover { background: var(--indigo-lt); border-color: var(--indigo); }

  /* ── MAIN ── */
  main {
    padding: 32px 36px;
    overflow: auto;
  }
  .student-header {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .student-header-info { flex: 1; min-width: 160px; }
  .student-header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; margin-left: auto; }
  .student-header .avatar { width: 54px; height: 54px; font-size: 20px; flex-shrink: 0; }
  .student-header h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 24px;
  }
  .student-header .subject-badge {
    display: inline-block;
    background: var(--indigo-lt);
    color: var(--indigo);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    margin-top: 4px;
  }

  /* SCHEDULE BLOCK in student header */
  .schedule-block {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #FDF0F6 0%, #F7E8F5 100%);
    border: 1.5px solid #EAC9E0;
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 210px;
    flex-shrink: 0;
    position: relative;
  }
  .schedule-icon { font-size: 20px; flex-shrink: 0; }
  .schedule-body { flex: 1; min-width: 0; }
  .schedule-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .schedule-text {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--indigo);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .schedule-empty {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }
  .schedule-edit-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    padding: 2px 4px;
    border-radius: 5px;
    transition: color .15s, background .15s;
    flex-shrink: 0;
  }
  .schedule-edit-btn:hover { color: var(--indigo); background: var(--indigo-lt); }

  /* inline schedule editor */
  .schedule-editor {
    background: var(--surface);
    border: 1.5px solid var(--indigo);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    margin-top: 8px;
    margin-bottom: 16px;
    display: none;
  }
  .schedule-editor.open { display: block; }
  .schedule-slot-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .schedule-days {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .day-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background .12s, border-color .12s, color .12s;
  }
  .day-btn.selected {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #fff;
  }
  .slot-time-input {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--bg);
    color: var(--text);
    width: 110px;
  }
  .slot-time-input:focus { border-color: var(--indigo); }
  .slot-remove-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 5px;
    transition: color .12s, background .12s;
    line-height: 1;
  }
  .slot-remove-btn:hover { color: var(--red); background: var(--red-lt); }
  .btn-add-slot {
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--indigo);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color .12s, background .12s;
    margin-top: 4px;
  }
  .btn-add-slot:hover { border-color: var(--indigo); background: var(--indigo-lt); }
  .btn-edit-student {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    transition: border-color .15s, color .15s;
  }
  .btn-edit-student:hover { border-color: var(--indigo); color: var(--indigo); }
  .btn-delete-student {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--red);
    font-family: 'Inter', sans-serif;
    transition: border-color .15s;
  }
  .btn-delete-student:hover { border-color: var(--red); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 28px;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 10px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color .15s, border-color .15s;
    border-radius: 8px 8px 0 0;
  }
  .tab-btn:hover { color: var(--indigo); }
  .tab-btn.active { color: var(--indigo); border-bottom-color: var(--indigo); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stat-value {
    font-family: 'Montserrat', sans-serif;
    font-size: 26px;
    font-weight: 800;
  }
  .stat-sub { font-size: 12px; color: var(--muted); }

  /* SECTION CARD */
  .section-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px;
    margin-bottom: 20px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .section-head h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 700;
  }

  /* TOPICS */
  .topics-list { display: flex; flex-direction: column; gap: 8px; }
  .topic-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    transition: border-color .15s, background .15s;
    cursor: pointer;
  }
  .topic-row:hover { border-color: var(--indigo); background: var(--indigo-lt); }
  .topic-check {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  .topic-row.done .topic-check {
    background: var(--green);
    border-color: var(--green);
  }
  .topic-row.done .topic-check::after {
    content: '';
    display: block;
    width: 10px; height: 7px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(1px,-1px);
  }
  .topic-text { flex: 1; font-size: 14px; }
  .topic-row.done .topic-text { color: var(--muted); text-decoration: line-through; }

  /* date pills */
  .topic-date-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .topic-date-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600;
    border-radius: 20px;
    padding: 3px 9px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
    user-select: none;
  }
  .topic-date-pill.plan { background: var(--indigo-lt); color: var(--indigo); border-color: #f3b9d4; }
  .topic-date-pill.plan:hover { background: #fad2e6; border-color: var(--indigo); }
  .topic-date-pill.overdue { background: var(--red-lt); color: var(--red); border-color: #f5c0c0; }
  .topic-date-pill.overdue:hover { background: #fadddd; border-color: var(--red); }
  .topic-date-pill.done-date { background: var(--green-lt); color: var(--green); border-color: #b3e8cf; }
  .topic-date-pill.done-date:hover { background: #cff0e2; border-color: var(--green); }
  .topic-date-pill.no-date { background: transparent; color: var(--muted); border-color: var(--border); border-style: dashed; }
  .topic-date-pill.no-date:hover { border-color: var(--indigo); color: var(--indigo); }
  .topic-date-input {
    border: 1.5px solid var(--indigo);
    border-radius: 7px;
    padding: 3px 8px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--surface);
    color: var(--text);
  }

  .topic-date { font-size: 12px; color: var(--muted); }
  .btn-remove-item {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color .15s, background .15s;
  }
  .btn-remove-item:hover { color: var(--red); background: var(--red-lt); }

  /* ADD INPUT */
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .add-row input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .15s;
    background: var(--bg);
    color: var(--text);
  }
  .add-row input:focus { border-color: var(--indigo); }
  .btn-add {
    background: var(--indigo);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background .15s;
    white-space: nowrap;
  }
  .btn-add:hover { background: #B85580; }

  /* ATTENDANCE */
  .attendance-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .att-cell {
    border-radius: 10px;
    border: 1.5px solid var(--border);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .att-cell:hover { border-color: var(--indigo); }
  .att-cell.present { background: var(--green-lt); border-color: var(--green); }
  .att-cell.absent  { background: var(--red-lt);   border-color: var(--red); }
  .att-cell.planned {
    background: var(--indigo-lt);
    border-color: #f3b9d4;
    border-style: dashed;
  }
  .att-cell.planned:hover { border-color: var(--indigo); border-style: dashed; }
  .att-date { font-size: 13px; font-weight: 600; }
  .att-status {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .att-cell.present .att-status { color: var(--green); }
  .att-cell.absent  .att-status { color: var(--red); }
  .att-cell.planned .att-status { color: var(--indigo); }
  .att-cell .att-remove {
    position: absolute;
    top: 6px; right: 6px;
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    opacity: 0;
    transition: opacity .15s;
  }
  .att-cell:hover .att-remove { opacity: 1; }

  .att-add-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .att-add-row input[type="date"] {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--bg);
    color: var(--text);
    transition: border-color .15s;
  }
  .att-add-row input[type="date"]:focus { border-color: var(--indigo); }
  .btn-present {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background .15s;
  }
  .btn-present:hover { background: #69B690; }
  .btn-absent {
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background .15s;
  }
  .btn-absent:hover { background: #D67A7A; }

  /* HOMEWORK */
  .hw-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    transition: border-color .15s, background .15s;
  }
  .hw-row:hover { border-color: var(--indigo); background: var(--indigo-lt); }
  .hw-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
    border: none;
    font-family: 'Inter', sans-serif;
    transition: background .15s, color .15s;
  }
  .hw-badge.pending  { background: var(--amber-lt); color: var(--amber); }
  .hw-badge.done     { background: var(--green-lt);  color: var(--green); }
  .hw-badge.overdue  { background: var(--red-lt);    color: var(--red);   }
  .hw-text { flex: 1; font-size: 14px; }
  .hw-row.status-done .hw-text { color: var(--muted); text-decoration: line-through; }
  .hw-due { font-size: 12px; color: var(--muted); flex-shrink: 0; }

  .hw-add-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .hw-add-row input[type="text"] {
    flex: 1;
    min-width: 140px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .15s;
    background: var(--bg);
    color: var(--text);
  }
  .hw-add-row input[type="text"]:focus { border-color: var(--indigo); }
  .hw-add-row input[type="date"] {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--bg);
    color: var(--text);
    transition: border-color .15s;
  }
  .hw-add-row input[type="date"]:focus { border-color: var(--indigo); }

  /* HW IMAGE ATTACHMENTS */
  .hw-row { flex-wrap: wrap; }
  .hw-main-line {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .hw-images {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    padding: 6px 0 2px 0;
  }
  .hw-thumb-wrap {
    position: relative;
    display: inline-block;
  }
  .hw-thumb {
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    display: block;
    transition: opacity .15s, border-color .15s;
  }
  .hw-thumb:hover { opacity: .85; border-color: var(--indigo); }
  .hw-thumb-del {
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 11px;
    line-height: 18px;
    text-align: center;
    padding: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .hw-thumb-wrap:hover .hw-thumb-del { display: flex; }

  /* attach button inside hw-row */
  .btn-attach {
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color .15s, color .15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-attach:hover { border-color: var(--indigo); color: var(--indigo); }

  /* drop zone in add form */
  .hw-dropzone {
    width: 100%;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .2s, background .2s;
    margin-top: 4px;
  }
  .hw-dropzone:hover, .hw-dropzone.drag-over {
    border-color: var(--indigo);
    background: var(--indigo-lt);
    color: var(--indigo);
  }
  .hw-dropzone-previews {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .dz-thumb-wrap { position: relative; display: inline-block; }
  .dz-thumb {
    width: 64px; height: 64px;
    object-fit: cover;
    border-radius: 7px;
    border: 1.5px solid var(--border);
    display: block;
  }
  .dz-thumb-del {
    position: absolute;
    top: -6px; right: -6px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 11px;
    line-height: 18px;
    text-align: center;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  /* LIGHTBOX */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(10,14,28,.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 300;
    backdrop-filter: blur(6px);
    cursor: zoom-out;
  }
  .lightbox.hidden { display: none; }
  .lightbox img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0,0,0,.5);
    cursor: default;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    opacity: .7;
    transition: opacity .15s;
    background: none;
    border: none;
  }
  .lightbox-close:hover { opacity: 1; }

  /* LINKS TAB */
  .board-pin {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, #AE4F78 0%, #B85580 100%);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 18px rgba(204,107,150,.22);
  }
  .board-pin-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .board-pin-body { flex: 1; min-width: 0; }
  .board-pin-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: rgba(255,255,255,.7);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .board-pin-url {
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .board-pin-empty {
    color: rgba(255,255,255,.85);
    font-size: 14px;
  }
  .board-pin-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .board-pin-btn {
    background: rgba(255,255,255,.18);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background .15s;
    white-space: nowrap;
  }
  .board-pin-btn:hover { background: rgba(255,255,255,.3); }
  .board-pin-btn.edit-btn {
    background: #fff;
    color: var(--indigo);
  }
  .board-pin-btn.edit-btn:hover { background: rgba(255,255,255,.9); }

  .link-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    transition: border-color .15s, background .15s;
  }
  .link-row:hover { border-color: var(--indigo); background: var(--indigo-lt); }
  .link-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--indigo-lt);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .link-body { flex: 1; min-width: 0; }
  .link-title { font-size: 14px; font-weight: 600; }
  .link-url {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    max-width: 100%;
  }
  .link-open-btn {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--indigo);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: border-color .15s, background .15s;
    white-space: nowrap;
    text-decoration: none;
    flex-shrink: 0;
  }
  .link-open-btn:hover { border-color: var(--indigo); background: var(--indigo-lt); }

  .link-add-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .link-add-row input {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color .15s;
    background: var(--bg);
    color: var(--text);
  }
  .link-add-row input:focus { border-color: var(--indigo); }
  .link-add-row input.link-title-input { flex: 0 0 160px; }
  .link-add-row input.link-url-input { flex: 1; min-width: 160px; }

  /* FINANCE TAB */
  .fin-summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .fin-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    transition: border-color .15s, background .15s;
  }
  .fin-row:hover { border-color: var(--indigo); background: var(--indigo-lt); }
  .fin-paid-badge, .fin-unpaid-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
    border: none;
    font-family: 'Inter', sans-serif;
  }
  .fin-paid-badge { background: var(--green-lt); color: var(--green); }
  .fin-unpaid-badge { background: var(--red-lt); color: var(--red); }
  .fin-date { font-size: 13px; flex: 1; }
  .fin-amount { font-weight: 700; font-size: 14px; }
  .fin-add-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .fin-add-row input {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--bg);
    color: var(--text);
  }
  .fin-add-row input:focus { border-color: var(--indigo); }
  .fin-add-row input.fin-amount-input { width: 110px; }
  .fin-add-row input.fin-date-input { width: 150px; }

  /* SESSION NOTES (inside attendance cells) */
  .att-note-btn {
    margin-top: 6px;
    width: 100%;
    background: rgba(255,255,255,.6);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 3px 0;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .att-note-btn:hover { border-color: var(--indigo); color: var(--indigo); }
  .att-note-btn.has-note { background: var(--indigo-lt); border-style: solid; border-color: var(--indigo); color: var(--indigo); }

  /* MISTAKES BANK */
  .mistake-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    transition: border-color .15s, background .15s;
  }
  .mistake-row:hover { border-color: var(--indigo); background: var(--indigo-lt); }
  .mistake-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .mistake-text { flex: 1; font-size: 14px; line-height: 1.5; }
  .mistake-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mistake-add-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .mistake-add-row textarea {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    min-height: 38px;
  }
  .mistake-add-row textarea:focus { border-color: var(--indigo); }

  /* PROGRAM TEMPLATES */
  .template-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
  }
  .template-name { flex: 1; font-size: 14px; font-weight: 600; }
  .template-count { font-size: 12px; color: var(--muted); }
  .template-apply-btn {
    background: var(--indigo);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .template-apply-btn:hover { background: #A8487A; }

  /* PRINT REPORT (hidden helper iframe content uses inline styles) */
  .btn-export {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--indigo);
    font-family: 'Inter', sans-serif;
    transition: border-color .15s, background .15s;
  }
  .btn-export:hover { border-color: var(--indigo); background: var(--indigo-lt); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20,12,16,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal h3 {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 20px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: var(--bg);
    color: var(--text);
    transition: border-color .15s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--indigo); }
  .color-swatches {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid var(--border);
    transition: border-color .15s, transform .15s;
  }
  .swatch.selected { border-color: var(--text); transform: scale(1.15); }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    justify-content: flex-end;
  }
  .btn-secondary {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    transition: border-color .15s;
  }
  .btn-secondary:hover { border-color: var(--indigo); color: var(--indigo); }
  .btn-primary {
    background: var(--indigo);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background .15s;
  }
  .btn-primary:hover { background: #B85580; }

  /* PROGRESS BAR */
  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--indigo);
    transition: width .4s ease;
  }

  /* NO STUDENT SELECTED */
  .no-student {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 400px;
    color: var(--muted);
    gap: 16px;
    text-align: center;
  }
  .no-student .big-icon { font-size: 56px; opacity: .4; }
  .no-student h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--blue);
    opacity: .5;
  }
  .no-student p { font-size: 14px; max-width: 240px; }

  /* DASHBOARD */
  .dash-greeting {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 24px;
    margin-bottom: 4px;
  }
  .dash-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

  .dash-stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .dash-stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }
  .dash-stat-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .dash-stat-value {
    font-family: 'Montserrat', sans-serif;
    font-size: 24px;
    font-weight: 800;
    margin-top: 4px;
  }

  .dash-section-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .upcoming-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

<script>
// ─── AUTH ────────────────────────────────────────────────────────────────────
const AUTH_KEY   = 'tutorAuth_hash';
const SESSION_KEY = 'tutorAuth_session';
const DEFAULT_PASSWORD = 'репетитор'; // shown as hint on first launch

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function getStoredHash() { return localStorage.getItem(AUTH_KEY); }
function setStoredHash(h) { localStorage.setItem(AUTH_KEY, h); }
function setSession()     { sessionStorage.setItem(SESSION_KEY, '1'); }
function hasSession()     { return sessionStorage.getItem(SESSION_KEY) === '1'; }
function clearSession()   { sessionStorage.removeItem(SESSION_KEY); }

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appRoot').style.display = 'contents';
}
function showLoginScreen() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appRoot').style.display = 'none';
  setTimeout(() => document.getElementById('loginPassword').focus(), 100);
}

async function submitLogin() {
  const pwd = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  if (!pwd) { errEl.classList.add('show'); errEl.textContent = 'Введите пароль.'; return; }
  const hash = await sha256(pwd);
  const stored = getStoredHash();
  if (!stored) {
    // First launch — any password sets it
    setStoredHash(hash);
    setSession();
    document.getElementById('loginPassword').value = '';
    errEl.classList.remove('show');
    showApp();
    initApp();
    return;
  }
  if (hash === stored) {
    setSession();
    document.getElementById('loginPassword').value = '';
    errEl.classList.remove('show');
    showApp();
    initApp();
  } else {
    errEl.textContent = 'Неверный пароль. Попробуйте ещё раз.';
    errEl.classList.add('show');
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPassword').focus();
  }
}

function logout() {
  clearSession();
  showLoginScreen();
}

function showChangePassword() {
  ['cpwdCurrent','cpwdNew','cpwdRepeat'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('cpwdError').textContent = '';
  document.getElementById('changePwdModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('cpwdCurrent').focus(), 60);
}

async function submitChangePassword() {
  const current = document.getElementById('cpwdCurrent').value;
  const newPwd  = document.getElementById('cpwdNew').value;
  const repeat  = document.getElementById('cpwdRepeat').value;
  const errEl   = document.getElementById('cpwdError');

  if (!current || !newPwd || !repeat) { errEl.textContent = 'Заполните все поля.'; return; }
  if (newPwd.length < 4) { errEl.textContent = 'Новый пароль должен быть не менее 4 символов.'; return; }
  if (newPwd !== repeat) { errEl.textContent = 'Пароли не совпадают.'; return; }

  const currentHash = await sha256(current);
  if (currentHash !== getStoredHash()) { errEl.textContent = 'Текущий пароль неверен.'; return; }

  const newHash = await sha256(newPwd);
  setStoredHash(newHash);
  document.getElementById('changePwdModal').classList.add('hidden');
  // Show brief success toast
  const toast = document.createElement('div');
  toast.textContent = '✓ Пароль успешно изменён';
  toast.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--green);color:#fff;padding:12px 24px;border-radius:10px;
    font-weight:600;font-size:14px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.15)`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// Boot: check session before showing anything
(function boot() {
  if (hasSession()) {
    // Already logged in this browser session
    showApp();
    // initApp() will be called below after STATE section loads
    // We defer it so all functions are defined first
    window._autoInit = true;
  } else {
    // Show login; set hint if first launch
    const hint = document.getElementById('loginHint');
    if (!getStoredHash()) {
      hint.textContent = 'Первый вход: придумайте любой пароль и нажмите «Войти» — он сохранится.';
    }
  }
})();

// ─── STATE ───────────────────────────────────────────────────────────────────
const COLORS = ['#F2C2D6','#C2D8F2','#C7E8D6','#F2DBBE','#DCC9EE','#F2C2BE','#C2E2E5','#F0E0A8','#D2DCC0','#EEC2E2'];
const STORAGE_KEY = 'tutorJournal_v2';
const WEEK_DAYS = ['пн','вт','ср','чт','пт','сб','вс'];

let state = {
  students: [],
  activeId: null,
  templates: [],
  view: 'dashboard'   // 'dashboard' | 'student'
};

let activeTab = 'topics';

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
      if (!('templates' in state)) state.templates = [];
      if (!('view' in state)) state.view = state.activeId ? 'student' : 'dashboard';
      // Migrate old topic format: {date: "дд.мм"} → {planDate:'', doneDate:''}
      state.students.forEach(s => {
        if (!('boardUrl' in s)) s.boardUrl = '';
        if (!('links' in s)) s.links = [];
        if (!('hourlyRate' in s)) s.hourlyRate = 1500;
        if (!('payments' in s)) s.payments = [];
        if (!('mistakes' in s)) s.mistakes = [];
        if (!('schedule' in s)) s.schedule = { slots: [] };
        // migrate old format {days,time} → {slots}
        else if (!Array.isArray(s.schedule.slots)) {
          s.schedule = { slots: normalizeSchedule(s.schedule) };
        }
        (s.topics || []).forEach(t => {
          if (!('planDate' in t)) t.planDate = '';
          if (!('doneDate' in t)) {
            // old t.date was "дд.мм" (display only), can't reliably convert — drop it
            t.doneDate = t.done ? todayStr() : '';
            delete t.date;
          }
        });
        (s.attendance || []).forEach(a => {
          if (!('note' in a)) a.note = '';
        });
      });
    }
  } catch(e) {}
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ─── INIT ─────────────────────────────────────────────────────────────────────

        ],

        ],

          { id: uid(), text: 'Путает Present Perfect и Past Simple в устной речи', date: '2025-06-17' },
        ],
        topics: [
          { id: uid(), text: 'Present Perfect vs Past Simple', done: true,  planDate: '2025-06-10', doneDate: '2025-06-10' },
          { id: uid(), text: 'Conditionals (0, 1, 2)',          done: true,  planDate: '2025-06-17', doneDate: '2025-06-17' },
          { id: uid(), text: 'Passive Voice',                   done: false, planDate: '2025-06-24', doneDate: '' },

        ],

        ],

  renderSidebar();
  if (state.view === 'student' && state.activeId) {

}

// Auto-init if session already active (boot() set _autoInit)
if (window._autoInit) initApp();

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('studentList');
  list.innerHTML = '';
  state.students.forEach(s => {
    const pct = progressOf(s);
    const el = document.createElement('div');
    el.className = 'student-card' + (s.id === state.activeId && state.view === 'student' ? ' active' : '');
    el.onclick = () => selectStudent(s.id);
    const sch = s.schedule || {};
    const slots = normalizeSchedule(sch);
    const schText = slots.map(sl => sl.day + (sl.time ? ' ' + sl.time : '')).join(' / ');
    el.innerHTML = `
      <div class="avatar" style="background:${s.color}">${initials(s.name)}</div>
      <div class="student-info">
        <div class="student-name">${esc(s.name)}</div>
        <div class="student-subject">${esc(s.subject)}</div>
        ${schText ? `<div style="font-size:11px;color:var(--indigo);font-weight:600;margin-top:1px">📅 ${esc(schText)}</div>` : ''}
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="ring-wrap">${renderRing(pct, s.color)}</div>
    `;
    list.appendChild(el);
  });
}

function renderRing(pct, color) {
  const r = 14, cx = 16, cy = 16;
  const circ = 2 * Math.PI * r;
  const dash = circ * pct / 100;
  return `<svg width="32" height="32" viewBox="0 0 32 32">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="3"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="var(--text)" font-size="8" font-family="Montserrat" font-weight="700">${pct}%</text>
  </svg>`;
}

function progressOf(s) {
  if (!s.topics.length) return 0;
  return Math.round(s.topics.filter(t => t.done).length / s.topics.length * 100);
}

function setNavActive(id) {
  ['navHome','navSchedule'].forEach(btnId => {
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.toggle('nav-active', btnId === id);
  });
}

function selectStudent(id) {
  state.activeId = id;
  state.view = 'student';
  save();
  setNavActive(null);
  renderSidebar();
  renderMain();
}

function showDashboard() {

  save();

  renderDashboard();
}

function showScheduleView() {

  renderSidebar();

}

// ─── SCHEDULE VIEW ───────────────────────────────────────────────────────────
function renderScheduleView() {
  const main = document.getElementById('mainContent');

  // Time range: 08:00 – 20:00, step 10 min
  const START_H = 8, END_H = 20, STEP = 10;
  const DAYS = ['пн','вт','ср','чт','пт','сб','вс'];
  const CELL_H = 22; // px per 10-min slot
  const LESSON_DUR = 60; // assume 60-min lesson for display height

  // Today's day index (0=пн … 6=вс), js getDay: 0=sun,1=mon…
  const jsDay = new Date().getDay();
  const todayIdx = jsDay === 0 ? 6 : jsDay - 1; // convert to mon=0

  // Build time slots list
  const times = [];
  for (let h = START_H; h < END_H; h++) {
    for (let m = 0; m < 60; m += STEP) {
      times.push({ h, m, label: h + ':' + String(m).padStart(2,'0') });
    }
  }

  // Build lookup: dayIndex → [{student, time}]
  const lessonsByDay = Array.from({length: 7}, () => []);
  state.students.forEach(s => {
    const slots = normalizeSchedule(s.schedule || {});
    slots.forEach(sl => {
      const di = DAYS.indexOf(sl.day);
      if (di === -1 || !sl.time) return;
      lessonsByDay[di].push({ student: s, time: sl.time });
    });
  });

  // Generate time-to-row index for fast lookup
  function timeToRow(timeStr) {
    const [hh, mm] = timeStr.split(':').map(Number);
    return (hh - START_H) * (60 / STEP) + Math.floor(mm / STEP);
  }

  // Build grid rows HTML
  let rowsHtml = '';
  times.forEach(({ h, m, label }, rowIdx) => {
    const isHour = m === 0;
    const showLabel = isHour || m === 30;
    rowsHtml += `<div class="sg-time ${isHour ? 'hour-mark' : ''}">${showLabel ? label : ''}</div>`;

    DAYS.forEach((day, di) => {
      const isToday = di === todayIdx;
      rowsHtml += `<div class="sg-cell ${isHour ? 'hour-mark' : ''} ${isToday ? 'today-col' : ''}" data-day="${di}" data-row="${rowIdx}">`;
      // Place lessons that START at this slot
      lessonsByDay[di].forEach(({ student: s, time }) => {
        if (timeToRow(time) === rowIdx) {
          const heightPx = (LESSON_DUR / STEP) * CELL_H - 2;
          const prepKey = prepKey_(s.id, di, time);
          const isPrepped = getPrepState(prepKey);
          rowsHtml += `
            <div class="sg-lesson" style="background:${darkenColor(s.color)};height:${heightPx}px">
              <div class="sg-prep-check ${isPrepped ? 'checked' : ''}"
                title="${isPrepped ? 'Материал готов' : 'Отметить как подготовлено'}"
                onclick="togglePrep('${prepKey}',this)"></div>
              <div class="sg-lesson-name" onclick="selectStudent('${s.id}')">${esc(s.name)}</div>
              <div class="sg-lesson-time">${esc(time)}</div>
            </div>`;
        }
      });
      rowsHtml += `</div>`;
    });
  });

  // Legend
  const hasStudentsWithSchedule = state.students.some(s => normalizeSchedule(s.schedule || {}).length > 0);
  const legendHtml = state.students
    .filter(s => normalizeSchedule(s.schedule || {}).length > 0)
    .map(s => `
      <div class="legend-item" onclick="selectStudent('${s.id}')">
        <div class="legend-dot" style="background:${darkenColor(s.color)}"></div>
        <span>${esc(s.name)}</span>
        <span style="color:var(--muted);font-size:12px">
          ${normalizeSchedule(s.schedule).map(sl => sl.day + (sl.time ? ' ' + sl.time : '')).join(' / ')}
        </span>
      </div>`).join('');

  main.innerHTML = `
    <div class="schedule-view">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap">

// Darken a pastel hex color for text-on-color readability
function darkenColor(hex) {
  try {
    hex = hex.replace('#','');
    let r = parseInt(hex.slice(0,2),16);
    let g = parseInt(hex.slice(2,4),16);
    let b = parseInt(hex.slice(4,6),16);
    r = Math.round(r * 0.62);
    g = Math.round(g * 0.55);
    b = Math.round(b * 0.62);
    return `rgb(${r},${g},${b})`;
  } catch(e) { return '#BD5085'; }
}

// ─── PREP STATE ───────────────────────────────────────────────────────────────
// Key format: "prep_<studentId>_<dayIdx>_<HH:MM>"
function prepKey_(studentId, dayIdx, time) {
  return `prep_${studentId}_${dayIdx}_${time}`;
}

function getPrepState(key) {
  try { return localStorage.getItem(key) === '1'; } catch(e) { return false; }
}

function togglePrep(key, el) {
  const isNowChecked = !el.classList.contains('checked');
  try {
    if (isNowChecked) localStorage.setItem(key, '1');
    else localStorage.removeItem(key);
  } catch(e) {}
  el.classList.toggle('checked', isNowChecked);
  el.title = isNowChecked ? 'Материал готов' : 'Отметить как подготовлено';
}

function resetAllPrep() {
  try {
    const keys = Object.keys(localStorage).filter(k => k.startsWith('prep_'));
    keys.forEach(k => localStorage.removeItem(k));
  } catch(e) {}
  // Re-render only the checkboxes without full re-render for smoothness
  document.querySelectorAll('.sg-prep-check').forEach(el => {
    el.classList.remove('checked');
    el.title = 'Отметить как подготовлено';
  });
}

// ─── DASHBOARD ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const main = document.getElementById('mainContent');
  const today = todayStr();

  if (state.students.length === 0) {
    main.innerHTML = `
      <div class="no-student">
        <div class="big-icon">🎓</div>
        <h2>Добавьте первого ученика</h2>
        <p>Нажмите «+ Добавить ученика» в боковой панели, чтобы начать</p>
      </div>`;
    return;
  }

  // Aggregate stats
  let totalStudents = state.students.length;
  let totalHwPending = 0;
  let totalUnpaid = 0;
  let totalUnpaidSum = 0;
  let upcomingLessons = [];

  state.students.forEach(s => {
    (s.homework || []).forEach(h => {
      if (h.status === 'pending') totalHwPending++;
    });
    (s.payments || []).forEach(p => {
      if (!p.paid) { totalUnpaid++; totalUnpaidSum += (Number(p.amount) || 0); }
    });
    (s.attendance || []).forEach(a => {
      if (a.date >= today) {
        upcomingLessons.push({ student: s, date: a.date, attId: a.id });
      }
    });
  });

  upcomingLessons.sort((a, b) => a.date.localeCompare(b.date));
  upcomingLessons = upcomingLessons.slice(0, 6);

  const monthNames = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const upcomingHtml = upcomingLessons.map(u => {
    const d = new Date(u.date + 'T00:00:00');
    const day = d.getDate();
    const mon = monthNames[d.getMonth()];
    const isToday = u.date === today;
    const whenLabel = isToday ? 'Сегодня' : formatRelativeDay(u.date);
    return `
      <div class="upcoming-row" onclick="selectStudent('${u.student.id}')">
        <div class="upcoming-date-block">
          <div class="day">${day}</div>
          <div class="mon">${mon}</div>
        </div>
        <div class="avatar" style="background:${u.student.color}">${initials(u.student.name)}</div>
        <div class="upcoming-body">
          <div class="upcoming-name">${esc(u.student.name)}</div>
          <div class="upcoming-subject">${esc(u.student.subject)}</div>
        </div>
        <div class="upcoming-when">${whenLabel}</div>
      </div>`;
  }).join('');

  // Finance summary per student (unpaid only)
  const unpaidByStudent = state.students
    .map(s => ({ s, sum: (s.payments || []).filter(p => !p.paid).reduce((acc, p) => acc + (Number(p.amount) || 0), 0), count: (s.payments || []).filter(p => !p.paid).length }))
    .filter(x => x.count > 0);

  const financeHtml = unpaidByStudent.length ? unpaidByStudent.map(x => `
    <div class="dash-finance-row">
      <span>${esc(x.s.name)}</span>
      <span style="color:var(--red);font-weight:700">${x.sum.toLocaleString('ru-RU')} ₽ <span style="color:var(--muted);font-weight:500">(${x.count})</span></span>
    </div>
  `).join('') : `<div style="color:var(--muted);font-size:13px;padding:8px 0">Все занятия оплачены 🎉</div>`;

  main.innerHTML = `
    <div class="dash-greeting">Здравствуйте! 👋</div>
    <div class="dash-sub">${new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}</div>

    <div class="dash-stats-row">
      <div class="dash-stat-card">
        <div class="dash-stat-label">Учеников</div>
        <div class="dash-stat-value" style="color:var(--indigo)">${totalStudents}</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-label">Занятий впереди</div>
        <div class="dash-stat-value" style="color:var(--indigo)">${upcomingLessons.length ? state.students.reduce((a,s)=>a+(s.attendance||[]).filter(x=>x.date>=today).length,0) : 0}</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-label">ДЗ не сдано</div>
        <div class="dash-stat-value" style="color:var(--amber)">${totalHwPending}</div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-label">Долг по оплате</div>
        <div class="dash-stat-value" style="color:var(--red)">${totalUnpaidSum.toLocaleString('ru-RU')} ₽</div>
      </div>
    </div>

    <div class="dash-two-col">
      <div>
        <div class="dash-section-title">📅 Ближайшие занятия</div>
        <div class="upcoming-list">
          ${upcomingHtml || '<div class="empty-state"><div class="icon">📅</div><p>Запланированных занятий пока нет</p></div>'}
        </div>
      </div>
      <div>
        <div class="dash-section-title">💰 Задолженности</div>
        <div class="section-card" style="padding:16px 18px">
          ${financeHtml}
        </div>
      </div>
    </div>
  `;
}

function formatRelativeDay(iso) {
  const today = new Date(todayStr() + 'T00:00:00');
  const target = new Date(iso + 'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  if (diffDays === 0) return 'Сегодня';
  if (diffDays === 1) return 'Завтра';
  if (diffDays > 1 && diffDays < 7) return `Через ${diffDays} дн.`;
  return formatDate(iso);
}

// ─── TOPICS ──────────────────────────────────────────────────────────────────
function renderTopicsPanel(s) {
  const today = todayStr();
  const items = s.topics.map(t => {
    // Migrate old format: t.date was "дд.мм" string → treat as no ISO date
    const planISO  = t.planDate  || '';  // ISO planned date
    const doneISO  = t.doneDate  || '';  // ISO actual completion date

    // Build plan pill
    let planPill = '';
    if (planISO) {
      const isOverdue = !t.done && planISO < today;
      const cls = isOverdue ? 'overdue' : 'plan';
      const icon = isOverdue ? '⚠' : '📅';
      planPill = `<span class="topic-date-pill ${cls}" onclick="event.stopPropagation();editTopicDate('${t.id}','plan')"
        title="Плановая дата — нажмите, чтобы изменить">${icon} план: ${formatDate(planISO)}</span>`;
    } else {
      planPill = `<span class="topic-date-pill no-date" onclick="event.stopPropagation();editTopicDate('${t.id}','plan')"
        title="Добавить плановую дату">+ план</span>`;
    }

    // Build done pill (only when done)
    let donePill = '';
    if (t.done) {
      if (doneISO) {
        donePill = `<span class="topic-date-pill done-date" onclick="event.stopPropagation();editTopicDate('${t.id}','done')"
          title="Фактическая дата — нажмите, чтобы изменить">✓ ${formatDate(doneISO)}</span>`;
      } else {
        donePill = `<span class="topic-date-pill no-date" onclick="event.stopPropagation();editTopicDate('${t.id}','done')"
          title="Добавить фактическую дату">+ факт</span>`;
      }
    }

    return `
      <div class="topic-row ${t.done?'done':''}" onclick="toggleTopic('${t.id}')">
        <div class="topic-check"></div>
        <span class="topic-text">${esc(t.text)}</span>
        <div class="topic-date-wrap" id="tdw-${t.id}">
          ${planPill}
          ${donePill}
        </div>
        <button class="btn-remove-item" onclick="event.stopPropagation();removeTopic('${t.id}')">×</button>
      </div>`;
  }).join('');

  const templatesHtml = (state.templates || []).map(tpl => `
    <div class="template-row">
      <span class="template-name">${esc(tpl.name)}</span>
      <span class="template-count">${tpl.topics.length} тем</span>
      <button class="template-apply-btn" onclick="applyTemplate('${tpl.id}')">Применить</button>
      <button class="btn-remove-item" onclick="removeTemplate('${tpl.id}')">×</button>
    </div>
  `).join('');

  return `
    <div class="section-card">
      <div class="section-head">
        <h2>Шаблоны программ</h2>
        <button class="btn-export" onclick="showSaveTemplateForm()">💾 Сохранить как шаблон</button>
      </div>
      <div id="saveTemplateForm" style="display:none;margin-bottom:14px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input id="templateNameInput" type="text" placeholder='Например: "Подготовка к ОГЭ"'
            style="flex:1;min-width:180px;border:1.5px solid var(--indigo);border-radius:8px;
              padding:9px 14px;font-size:14px;font-family:Inter,sans-serif;outline:none;
              background:var(--bg);color:var(--text)"
            onkeydown="if(event.key==='Enter')confirmSaveTemplate();if(event.key==='Escape')hideSaveTemplateForm()">
          <button class="btn-add" onclick="confirmSaveTemplate()">Сохранить</button>
          <button class="btn-secondary" onclick="hideSaveTemplateForm()">Отмена</button>
        </div>
      </div>
      ${(state.templates || []).length ? `<div class="topics-list">${templatesHtml}</div>` :
        `<div style="color:var(--muted);font-size:13px">Шаблонов пока нет. Соберите список тем ниже и сохраните как шаблон — потом сможете применить его к любому ученику в один клик.</div>`}
    </div>

    <div class="section-card">
      <div class="section-head"><h2>Список тем</h2></div>
      <div class="topics-list">
        ${items || '<div class="empty-state"><div class="icon">📋</div><p>Темы пока не добавлены</p></div>'}
      </div>
      <div class="add-row" style="align-items:center;flex-wrap:wrap;gap:8px">
        <input type="text" id="newTopicInput" placeholder="Новая тема..." style="flex:1;min-width:160px"
          onkeydown="if(event.key==='Enter')addTopic()">
        <input type="date" id="newTopicDate" title="Плановая дата"
          style="border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;font-family:Inter,sans-serif;outline:none;background:var(--bg);color:var(--text)">

}

function toggleTopic(id) {
  const s = getActive();
  const t = s.topics.find(x => x.id === id);
  t.done = !t.done;
  if (t.done && !t.doneDate) {
    t.doneDate = todayStr();
  } else if (!t.done) {
    t.doneDate = '';
  }
  save(); renderSidebar(); renderMain();
}

function removeTopic(id) {
  const s = getActive();
  s.topics = s.topics.filter(x => x.id !== id);
  save(); renderSidebar(); renderMain();
}

function addTopic() {
  const inp = document.getElementById('newTopicInput');
  const dateinp = document.getElementById('newTopicDate');
  const text = inp.value.trim();
  if (!text) return;
  getActive().topics.push({ id: uid(), text, done: false, planDate: dateinp.value || '', doneDate: '' });
  inp.value = '';
  // keep date for convenience, user can clear manually
  save(); renderSidebar(); renderMain();
  setTimeout(() => { const el = document.getElementById('newTopicInput'); if (el) el.focus(); }, 50);
}

// Inline date editor: replaces the pill with a date input, saves on change/blur
function editTopicDate(topicId, kind) {
  const wrap = document.getElementById('tdw-' + topicId);
  if (!wrap) return;

  const s = getActive();
  const t = s.topics.find(x => x.id === topicId);
  const currentVal = kind === 'plan' ? (t.planDate || '') : (t.doneDate || '');

  // Replace the right pill with an <input type="date">
  // Find the pill to replace (first = plan, second = done)
  const pills = wrap.querySelectorAll('.topic-date-pill');
  const targetPill = kind === 'plan' ? pills[0] : pills[1];
  if (!targetPill) return;

  const inp = document.createElement('input');
  inp.type = 'date';
  inp.className = 'topic-date-input';
  inp.value = currentVal;

  let committed = false;

  const commit = () => {
    if (committed) return;
    committed = true;
    if (kind === 'plan') t.planDate = inp.value;
    else t.doneDate = inp.value;
    save(); renderSidebar(); renderMain();
  };

  const cancel = () => {
    if (committed) return;
    committed = true;
    renderSidebar(); renderMain();
  };

  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });

  targetPill.replaceWith(inp);
  inp.focus();
  try { inp.showPicker(); } catch(e) {}
}

  const form = document.getElementById('saveTemplateForm');

function confirmSaveTemplate() {
  const inp = document.getElementById('templateNameInput');
  if (!inp || !inp.value.trim()) { if (inp) inp.focus(); return; }
  const s = getActive();
  if (!s.topics.length) return;
  const tpl = { id: uid(), name: inp.value.trim(), topics: s.topics.map(t => t.text) };
  if (!state.templates) state.templates = [];
  state.templates.push(tpl);
  save(); renderMain();
}

function applyTemplate(tplId) {
  const tpl = (state.templates || []).find(t => t.id === tplId);
  if (!tpl) return;
  // Show inline confirm banner
  const existing = document.getElementById('applyTemplateConfirm');
  if (existing) existing.remove();
  const banner = document.createElement('div');
  banner.id = 'applyTemplateConfirm';
  banner.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--surface);border:1.5px solid var(--indigo);border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.15);padding:16px 20px;z-index:250;
    display:flex;align-items:center;gap:12px;max-width:90vw;`;
  banner.innerHTML = `
    <span style="font-size:14px;color:var(--text)">Добавить <b>${tpl.topics.length}</b> тем из шаблона «${esc(tpl.name)}»?</span>
    <button class="btn-add" style="padding:7px 14px;font-size:13px" onclick="confirmApplyTemplate('${tplId}')">Добавить</button>
    <button class="btn-secondary" style="padding:7px 12px;font-size:13px" onclick="document.getElementById('applyTemplateConfirm').remove()">Отмена</button>
  `;
  document.body.appendChild(banner);
}
function confirmApplyTemplate(tplId) {
  const tpl = (state.templates || []).find(t => t.id === tplId);
  if (!tpl) return;
  const s = getActive();
  tpl.topics.forEach(text => s.topics.push({ id: uid(), text, done: false, planDate: '', doneDate: '' }));
  const banner = document.getElementById('applyTemplateConfirm');
  if (banner) banner.remove();
  save(); renderSidebar(); renderMain();
}

function removeTemplate(tplId) {
  state.templates = (state.templates || []).filter(t => t.id !== tplId);
  save(); renderMain();
}

// ─── ATTENDANCE ───────────────────────────────────────────────────────────────
function renderAttendancePanel(s) {
  const today = todayStr();
  const sorted = [...s.attendance].sort((a, b) => a.date.localeCompare(b.date));

  // Split into past/today and future
  const past    = sorted.filter(a => a.date <= today);
  const planned = sorted.filter(a => a.date >  today);

  function cellHtml(a) {
    const isFuture = a.date > today;
    const cls   = isFuture ? 'planned' : (a.present ? 'present' : 'absent');
    const icon  = isFuture ? '📅' : (a.present ? '✓' : '✗');
    const label = isFuture ? 'Запланировано'
                           : (a.present ? 'Был' : 'Пропустил');
    // future cells cycle: planned → (on day) becomes actionable; clicking marks present
    const clickHandler = isFuture
      ? `onclick="event.stopPropagation()"`   // no toggle for future — can only delete
      : `onclick="toggleAttendance('${a.id}')"`;
    const hasNote = a.note && a.note.trim();
    return `
      <div class="att-cell ${cls}" ${clickHandler}>
        <button class="att-remove" onclick="event.stopPropagation();removeAttendance('${a.id}')"
          title="Удалить">×</button>
        <div class="att-date">${formatDate(a.date)}</div>
        <div class="att-status">${icon} ${label}</div>
        ${isFuture ? `
          <div style="display:flex;gap:4px;margin-top:6px">
            <button style="flex:1;font-size:10px;font-weight:700;font-family:Inter,sans-serif;
              padding:3px 0;border-radius:5px;border:none;cursor:pointer;
              background:var(--green);color:#fff"
              onclick="event.stopPropagation();markAttendance('${a.id}',true)">✓ Был</button>
            <button style="flex:1;font-size:10px;font-weight:700;font-family:Inter,sans-serif;
              padding:3px 0;border-radius:5px;border:none;cursor:pointer;
              background:var(--red);color:#fff"
              onclick="event.stopPropagation();markAttendance('${a.id}',false)">✗ Нет</button>
          </div>` : `
          <button class="att-note-btn ${hasNote ? 'has-note' : ''}" onclick="event.stopPropagation();editSessionNote('${a.id}')"
            title="${hasNote ? esc(a.note) : 'Добавить заметку об уроке'}">
            ${hasNote ? '📝 Заметка' : '+ заметка'}
          </button>`}
      </div>`;
  }

  const pastHtml    = past.map(cellHtml).join('');
  const plannedHtml = planned.map(cellHtml).join('');

  const attPresent = past.filter(a => a.present).length;
  const attTotal   = past.length;

  return `
    <div class="section-card">
      <div class="section-head">
        <h2>Журнал посещаемости</h2>
        <span style="font-size:13px;color:var(--muted)">
          Прошедших: <b style="color:var(--text)">${attPresent}/${attTotal}</b>
        </span>
      </div>

      ${planned.length ? `
        <div style="font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;
          letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);margin-bottom:10px">
          Запланированные занятия
        </div>
        <div class="attendance-grid" style="margin-bottom:20px">${plannedHtml}</div>
        <div style="font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;
          letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">
          Прошедшие занятия
        </div>` : ''}

      <div class="attendance-grid">
        ${pastHtml || (!planned.length ? '<div class="empty-state"><div class="icon">📅</div><p>Занятия ещё не записаны</p></div>' : '<div style="color:var(--muted);font-size:13px;padding:8px 0">Нет записей о прошедших занятиях</div>')}
      </div>

      <div class="att-add-row" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px">
        <input type="date" id="newAttDate" value="${todayStr()}">
        <button class="btn-present" onclick="addAttendance(true)">✓ Был</button>
        <button class="btn-absent"  onclick="addAttendance(false)">✗ Пропустил</button>
        <button style="background:var(--indigo);color:#fff;border:none;border-radius:8px;
          padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
          font-family:Inter,sans-serif;white-space:nowrap;transition:background .15s"
          onmouseover="this.style.background='#B85580'" onmouseout="this.style.background='var(--indigo)'"
          onclick="addAttendance('planned')">📅 Запланировать</button>
      </div>
    </div>`;
}

function toggleAttendance(id) {
  const s = getActive();
  const a = s.attendance.find(x => x.id === id);
  a.present = !a.present;
  save(); renderSidebar(); renderMain();
}

function markAttendance(id, present) {
  const s = getActive();
  const a = s.attendance.find(x => x.id === id);
  a.present = present;
  // move from "planned" to actual by keeping same date — status now decided
  save(); renderSidebar(); renderMain();
}

function removeAttendance(id) {
  const s = getActive();
  s.attendance = s.attendance.filter(x => x.id !== id);
  save(); renderSidebar(); renderMain();
}

function addAttendance(kind) {
  const inp = document.getElementById('newAttDate');
  if (!inp.value) return;
  const s = getActive();
  if (s.attendance.find(a => a.date === inp.value)) {
    alert('Запись на эту дату уже существует'); return;
  }
  if (kind === 'planned') {
    s.attendance.push({ id: uid(), date: inp.value, present: false, planned: true, note: '' });
  } else {
    s.attendance.push({ id: uid(), date: inp.value, present: kind === true, note: '' });
  }
  save(); renderSidebar(); renderMain();
}

    <div style="font-family:Montserrat,sans-serif;font-weight:700;font-size:14px;margin-bottom:10px;color:var(--text)">

    </div>
    <textarea id="sessionNoteText" rows="3"

        font-size:14px;font-family:Inter,sans-serif;outline:none;resize:vertical;
        background:var(--bg);color:var(--text);box-sizing:border-box"

    <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">

function saveSessionNote(attId) {
  const ta = document.getElementById('sessionNoteText');
  if (!ta) return;
  const s = getActive();
  const a = s.attendance.find(x => x.id === attId);

  const editor = document.getElementById('sessionNoteEditor');
  if (editor) editor.remove();
  renderMain();
}

// ─── HOMEWORK ─────────────────────────────────────────────────────────────────
function renderHomeworkPanel(s) {
  const today = todayStr();
  const items = s.homework.map(h => {
    let status = h.status;
    if (status === 'pending' && h.due && h.due < today) status = 'overdue';

    return `
      <div class="hw-row status-${status}">

          ${h.due ? `<span class="hw-due">до ${formatDate(h.due)}</span>` : ''}

        onclick="document.getElementById('hwDropzoneFile').click()"

        ondragleave="this.classList.remove('drag-over')"

        <input type="file" id="hwDropzoneFile" accept="image/*" multiple style="display:none" onchange="handleHWDropzoneFiles(this.files)">
      </div>
      <div class="hw-dropzone-previews" id="hwDzPreviews"></div>

// ── Image helpers ──────────────────────────────────────────────────────────────
let _attachingHWId = null;
let _pendingNewImages = []; // base64 for the *next* task being created

function triggerHWImageUpload(hwId) {
  _attachingHWId = hwId;
  const inp = document.getElementById('hwAttachFile');
  inp.value = '';
  inp.click();
}

function handleHWAttachFiles(files) {
  if (!files || !files.length) return;
  const s = getActive();
  const h = s.homework.find(x => x.id === _attachingHWId);
  if (!h) return;
  if (!h.images) h.images = [];
  readFilesAsBase64(Array.from(files), (results) => {
    h.images.push(...results);
    save(); renderSidebar(); renderMain();
  });
}

function removeHWImage(hwId, idx) {
  const s = getActive();
  const h = s.homework.find(x => x.id === hwId);
  if (!h || !h.images) return;
  h.images.splice(idx, 1);
  save(); renderSidebar(); renderMain();
}

function handleHWDrop(e) {
  e.preventDefault();
  document.getElementById('hwDropzone').classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  readFilesAsBase64(files, (results) => {
    _pendingNewImages.push(...results);
    renderDzPreviews();
  });
}

function handleHWDropzoneFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!arr.length) return;
  readFilesAsBase64(arr, (results) => {
    _pendingNewImages.push(...results);
    renderDzPreviews();
  });
}

function renderDzPreviews() {
  const wrap = document.getElementById('hwDzPreviews');
  if (!wrap) return;
  wrap.innerHTML = _pendingNewImages.map((src, i) => `
    <div class="dz-thumb-wrap">
      <img class="dz-thumb" src="${src}" alt="">
      <button class="dz-thumb-del" onclick="removePendingImg(${i})">×</button>
    </div>`).join('');
}

function removePendingImg(i) {
  _pendingNewImages.splice(i, 1);
  renderDzPreviews();
}

function readFilesAsBase64(files, cb) {
  const results = [];
  let done = 0;
  files.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      results[i] = e.target.result;
      done++;
      if (done === files.length) cb(results);
    };
    reader.readAsDataURL(file);
  });
}
