// ─── SCHEDULE EDITOR ─────────────────────────────────────────────────────────

// Normalize old format {days:[],time:''} → new [{day,time}]
function normalizeSchedule(sch) {
  if (!sch) return [];
  if (Array.isArray(sch.slots)) return sch.slots;
  // old format migration
  if (Array.isArray(sch.days) && sch.days.length) {
    return sch.days.map(d => ({ day: d, time: sch.time || '' }));
  }
  return [];
}

function scheduleToString(slots) {
  return slots.map(sl => sl.day + (sl.time ? ' ' + sl.time : '')).join(' / ');
}

function renderScheduleEditor(slots) {
  const rows = slots.length ? slots : [{ day: '', time: '' }];
  const rowsHtml = rows.map((sl, i) => renderSlotRow(sl, i)).join('');
  return `
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
      letter-spacing:.05em;margin-bottom:10px">Дни и время занятий</div>
    <div id="slotRows">${rowsHtml}</div>
    <button class="btn-add-slot" onclick="addSlotRow()">+ Добавить день</button>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn-add" onclick="saveSchedule()">Сохранить</button>
      <button class="btn-secondary" onclick="toggleScheduleEditor()">Отмена</button>
      <button class="btn-secondary" style="color:var(--red);margin-left:auto" onclick="clearSchedule()">Очистить всё</button>
    </div>`;
}

function renderSlotRow(sl, i) {
  const dayBtns = WEEK_DAYS.map(d =>
    `<button type="button" class="day-btn ${sl.day === d ? 'selected' : ''}"
      onclick="selectSlotDay(this, ${i}, '${d}')">${d}</button>`
  ).join('');
  return `
    <div class="schedule-slot-row" id="slotRow-${i}" data-index="${i}">
      <div class="schedule-days">${dayBtns}</div>
      <input class="slot-time-input" type="time" value="${esc(sl.time || '')}"
        data-slot="${i}" placeholder="Время">
      <button class="slot-remove-btn" onclick="removeSlotRow(${i})" title="Удалить">×</button>
    </div>`;
}

function selectSlotDay(btn, rowIndex, day) {
  // Deselect all day-btns in this row, select clicked one
  const row = document.getElementById('slotRow-' + rowIndex);
  if (!row) return;
  row.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function addSlotRow() {
  const container = document.getElementById('slotRows');
  if (!container) return;
  const i = container.querySelectorAll('.schedule-slot-row').length;
  const div = document.createElement('div');
  div.innerHTML = renderSlotRow({ day: '', time: '' }, i);
  container.appendChild(div.firstElementChild);
}

function removeSlotRow(i) {
  const row = document.getElementById('slotRow-' + i);
  if (row) row.remove();
  // Re-index remaining rows so IDs stay unique
  const container = document.getElementById('slotRows');
  if (!container) return;
  container.querySelectorAll('.schedule-slot-row').forEach((row, newIdx) => {
    row.id = 'slotRow-' + newIdx;
    row.dataset.index = newIdx;
    row.querySelectorAll('.day-btn').forEach(b => {
      b.setAttribute('onclick', `selectSlotDay(this, ${newIdx}, '${b.textContent.trim()}')`);
    });
    const timeInp = row.querySelector('.slot-time-input');
    if (timeInp) timeInp.dataset.slot = newIdx;
    const removeBtn = row.querySelector('.slot-remove-btn');
    if (removeBtn) removeBtn.setAttribute('onclick', `removeSlotRow(${newIdx})`);
  });
}

function collectSlots() {
  const container = document.getElementById('slotRows');
  if (!container) return [];
  const slots = [];
  container.querySelectorAll('.schedule-slot-row').forEach(row => {
    const selectedDay = row.querySelector('.day-btn.selected');
    const timeInp = row.querySelector('.slot-time-input');
    const day = selectedDay ? selectedDay.textContent.trim() : '';
    const time = timeInp ? timeInp.value : '';
    if (day) slots.push({ day, time });
  });
  return slots;
}

function saveSchedule() {
  const slots = collectSlots();
  const s = getActive();
  s.schedule = { slots };
  save(); renderSidebar(); renderMain();
}

function clearSchedule() {
  const s = getActive();
  s.schedule = { slots: [] };
  save(); renderSidebar(); renderMain();
}

function toggleScheduleEditor() {
  const editor = document.getElementById('scheduleEditor');
  if (!editor) return;
  editor.classList.toggle('open');
}

function addPayment(paid) {
  const dateInp = document.getElementById('newFinDate');
  const amountInp = document.getElementById('newFinAmount');
  const amount = parseFloat(amountInp.value);
  if (!dateInp.value || isNaN(amount) || amount <= 0) { amountInp.focus(); return; }
  const s = getActive();
  if (!s.payments) s.payments = [];
  s.payments.push({ id: uid(), date: dateInp.value, amount, paid });
  save(); renderSidebar(); renderMain();
}

function togglePayment(id) {
  const s = getActive();
  const p = (s.payments || []).find(x => x.id === id);
  if (!p) return;
  p.paid = !p.paid;
  save(); renderSidebar(); renderMain();
}

function removePayment(id) {
  const s = getActive();
  s.payments = (s.payments || []).filter(x => x.id !== id);
  save(); renderSidebar(); renderMain();
}

// ─── MISTAKES BANK ───────────────────────────────────────────────────────────
function renderMistakesPanel(s) {
  const sorted = [...(s.mistakes || [])].sort((a, b) => b.date.localeCompare(a.date));
  const rows = sorted.map(m => `
    <div class="mistake-row">
      <span class="mistake-icon">🧩</span>
      <div style="flex:1">
        <div class="mistake-text">${esc(m.text)}</div>
        <div class="mistake-date">${formatDate(m.date)}</div>
      </div>
      <button class="btn-remove-item" onclick="removeMistake('${m.id}')">×</button>
    </div>
  `).join('');

  return `
    <div class="section-card">
      <div class="section-head"><h2>Банк типовых ошибок</h2></div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:14px">
        Сюда стоит заносить повторяющиеся ошибки ученика — то, что стоит проверять перед каждой контрольной или экзаменом.
      </div>
      <div class="topics-list">
        ${rows || '<div class="empty-state"><div class="icon">🧩</div><p>Типовых ошибок пока не зафиксировано</p></div>'}
      </div>
      <div class="mistake-add-row">
        <textarea id="newMistakeInput" placeholder="Опишите ошибку, например: путает знаки при переносе через равно..."
          onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();addMistake();}"></textarea>
        <button class="btn-add" onclick="addMistake()">+ Добавить</button>
      </div>
    </div>`;
}

function addMistake() {
  const inp = document.getElementById('newMistakeInput');
  const text = inp.value.trim();
  if (!text) return;
  const s = getActive();
  if (!s.mistakes) s.mistakes = [];
  s.mistakes.push({ id: uid(), text, date: todayStr() });
  save(); renderMain();
  setTimeout(() => { const el = document.getElementById('newMistakeInput'); if (el) el.focus(); }, 50);
}

function removeMistake(id) {
  const s = getActive();
  s.mistakes = (s.mistakes || []).filter(x => x.id !== id);
  save(); renderMain();
}

// ─── LINKS ────────────────────────────────────────────────────────────────────
function normalizeUrl(u) {
  u = u.trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function hostnameOf(u) {
  try { return new URL(u).hostname.replace(/^www\./, ''); }
  catch(e) { return u; }
}

function renderLinksPanel(s) {
  const boardHtml = s.boardUrl ? `
    <div class="board-pin">
      <div class="board-pin-icon">🖊️</div>
      <div class="board-pin-body">
        <div class="board-pin-label">📌 Онлайн-доска</div>
        <div class="board-pin-url">${esc(hostnameOf(s.boardUrl))} — ${esc(s.boardUrl)}</div>
      </div>
      <div class="board-pin-actions">
        <a class="board-pin-btn edit-btn" href="${esc(s.boardUrl)}" target="_blank" rel="noopener noreferrer">Открыть ↗</a>
        <button class="board-pin-btn" onclick="showBoardUrlEditor()">✏ Изменить</button>
      </div>
    </div>
    <div id="boardUrlEditor" style="display:none;margin-top:10px">
      ${boardUrlEditorHtml(s.boardUrl)}
    </div>` : `
    <div class="board-pin">
      <div class="board-pin-icon">🖊️</div>
      <div class="board-pin-body">
        <div class="board-pin-label">📌 Онлайн-доска</div>
        <div class="board-pin-empty">Ссылка ещё не добавлена</div>
      </div>
      <div class="board-pin-actions">
        <button class="board-pin-btn edit-btn" onclick="showBoardUrlEditor()">+ Добавить ссылку</button>
      </div>
    </div>
    <div id="boardUrlEditor" style="display:none;margin-top:10px">
      ${boardUrlEditorHtml('')}
    </div>`;

  const linkItems = (s.links || []).map(l => `
    <div class="link-row">
      <div class="link-icon">🔗</div>
      <div class="link-body">
        <div class="link-title">${esc(l.title || hostnameOf(l.url))}</div>
        <span class="link-url">${esc(l.url)}</span>
      </div>
      <a class="link-open-btn" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Открыть ↗</a>
      <button class="btn-remove-item" onclick="removeLink('${l.id}')">×</button>
    </div>
  `).join('');

  return `
    ${boardHtml}
    <div class="section-card">
      <div class="section-head"><h2>Прочие ссылки и материалы</h2></div>
      <div class="topics-list">
        ${linkItems || '<div class="empty-state"><div class="icon">🔗</div><p>Ссылок пока нет — добавьте материалы, презентации, тренажёры</p></div>'}
      </div>
      <div class="link-add-row">
        <input type="text" id="newLinkTitle" class="link-title-input" placeholder="Название (необязательно)">
        <input type="text" id="newLinkUrl" class="link-url-input" placeholder="https://..." onkeydown="if(event.key==='Enter')addLink()">
        <button class="btn-add" onclick="addLink()">+ Добавить</button>
      </div>
    </div>`;
}

function boardUrlEditorHtml(current) {
  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <input id="boardUrlInput" type="text" value="${esc(current)}"
      placeholder="https://miro.com/..."
      style="flex:1;min-width:220px;border:1.5px solid var(--indigo);border-radius:8px;
        padding:9px 14px;font-size:14px;font-family:Inter,sans-serif;outline:none;
        background:var(--surface);color:var(--text)"
      onkeydown="if(event.key==='Enter')saveBoardUrl();if(event.key==='Escape')hideBoardUrlEditor();">
    <button class="btn-add" onclick="saveBoardUrl()">Сохранить</button>
    <button class="btn-secondary" onclick="hideBoardUrlEditor()">Отмена</button>
  </div>`;
}

function showBoardUrlEditor() {
  const editor = document.getElementById('boardUrlEditor');
  if (!editor) return;
  editor.style.display = 'block';
  const inp = document.getElementById('boardUrlInput');
  if (inp) { inp.focus(); inp.select(); }
}

function hideBoardUrlEditor() {
  const editor = document.getElementById('boardUrlEditor');
  if (editor) editor.style.display = 'none';
}

function saveBoardUrl() {
  const inp = document.getElementById('boardUrlInput');
  if (!inp) return;
  const s = getActive();
  s.boardUrl = normalizeUrl(inp.value);
  save(); renderMain();
  // renderMain() re-renders the links tab (activeTab stays 'links')
}

function addLink() {
  const titleInp = document.getElementById('newLinkTitle');
  const urlInp = document.getElementById('newLinkUrl');
  const url = normalizeUrl(urlInp.value);
  if (!url) { urlInp.focus(); return; }
  const s = getActive();
  if (!s.links) s.links = [];
  s.links.push({ id: uid(), title: titleInp.value.trim(), url });
  save(); renderMain();
  setTimeout(() => { const el = document.getElementById('newLinkUrl'); if (el) el.focus(); }, 50);
}

function removeLink(id) {
  const s = getActive();
  s.links = (s.links || []).filter(x => x.id !== id);
  save(); renderMain();
}

// ─── STUDENT MODAL ───────────────────────────────────────────────────────────
let editingStudentId = null;
let selectedColor = COLORS[0];

function openAddStudentModal() {
  editingStudentId = null;
  selectedColor = COLORS[0];
  document.getElementById('modalTitle').textContent = 'Новый ученик';
  document.getElementById('inputName').value = '';
  document.getElementById('inputSubject').value = '';
  document.getElementById('saveStudentBtn').textContent = 'Добавить';
  renderColorSwatches();
  document.getElementById('studentModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('inputName').focus(), 50);
}

function openEditStudentModal() {
  const s = getActive();
  editingStudentId = s.id;
  selectedColor = s.color;
  document.getElementById('modalTitle').textContent = 'Редактировать ученика';
  document.getElementById('inputName').value = s.name;
  document.getElementById('inputSubject').value = s.subject;
  document.getElementById('saveStudentBtn').textContent = 'Сохранить';
  renderColorSwatches();
  document.getElementById('studentModal').classList.remove('hidden');
}

function closeStudentModal() {
  document.getElementById('studentModal').classList.add('hidden');
}

function renderColorSwatches() {
  const wrap = document.getElementById('colorSwatches');
  wrap.innerHTML = COLORS.map(c => `
    <div class="swatch ${c===selectedColor?'selected':''}"
      style="background:${c}"
      onclick="pickColor('${c}')"></div>
  `).join('');
}

function pickColor(c) {
  selectedColor = c;
  renderColorSwatches();
}

function saveStudent() {
  const name = document.getElementById('inputName').value.trim();
  const subject = document.getElementById('inputSubject').value.trim();
  if (!name) { document.getElementById('inputName').focus(); return; }
  if (!subject) { document.getElementById('inputSubject').focus(); return; }

  if (editingStudentId) {
    const s = state.students.find(x => x.id === editingStudentId);
    s.name = name; s.subject = subject; s.color = selectedColor;
  } else {
    const s = {
      id: uid(), name, subject, color: selectedColor,
      topics: [], attendance: [], homework: [], boardUrl: '', links: [],
      hourlyRate: 1500, payments: [], mistakes: [], schedule: { slots: [] }
    };
    state.students.push(s);
    state.activeId = s.id;
    state.view = 'student';
  }
  save();
  closeStudentModal();
  renderSidebar();
  if (state.view === 'student' && state.activeId) renderMain();
  else renderDashboard();
}

function deleteStudent() {
  const s = getActive();
  // Show inline confirmation banner instead of confirm()
  const existing = document.getElementById('deleteStudentConfirm');
  if (existing) { existing.remove(); return; }
  const banner = document.createElement('div');
  banner.id = 'deleteStudentConfirm';
  banner.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--surface);border:1.5px solid var(--red);border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.15);padding:16px 20px;z-index:250;
    display:flex;align-items:center;gap:12px;max-width:90vw;`;
  banner.innerHTML = `
    <span style="font-size:14px;color:var(--text)">Удалить ученика <b>${esc(s.name)}</b>? Данные не восстановить.</span>
    <button style="background:var(--red);color:#fff;border:none;border-radius:8px;padding:7px 14px;
      font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif"
      onclick="confirmDeleteStudent()">Удалить</button>
    <button class="btn-secondary" style="padding:7px 12px;font-size:13px"
      onclick="document.getElementById('deleteStudentConfirm').remove()">Отмена</button>
  `;
  document.body.appendChild(banner);
}

function confirmDeleteStudent() {
  const banner = document.getElementById('deleteStudentConfirm');
  if (banner) banner.remove();
  state.students = state.students.filter(x => x.id !== state.activeId);
  state.activeId = null;
  state.view = 'dashboard';
  save(); renderSidebar(); showDashboard();
}

// ─── PARENT REPORT EXPORT ─────────────────────────────────────────────────────
function exportStudentReport(studentId) {
  const s = state.students.find(x => x.id === studentId);
  if (!s) return;

  const today = todayStr();
  const topicsDone = s.topics.filter(t => t.done).length;
  const topicsTotal = s.topics.length;
  const pastAtt = s.attendance.filter(a => a.date <= today);
  const attPresent = pastAtt.filter(a => a.present).length;
  const hwDone = s.homework.filter(h => h.status === 'done').length;
  const hwTotal = s.homework.length;
  const unpaidSum = (s.payments || []).filter(p => !p.paid).reduce((a, p) => a + (Number(p.amount) || 0), 0);

  const topicsListHtml = s.topics.map(t => `
    <tr>
      <td style="padding:8px 10px;border-bottom:1px solid #eee">${esc(t.text)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center">${t.done ? '✅ Пройдено' : '⏳ В планах'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center;color:#888">${t.done && t.doneDate ? formatDate(t.doneDate) : (t.planDate ? formatDate(t.planDate) : '—')}</td>
    </tr>`).join('');

  const attListHtml = pastAtt.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a => `
    <tr>
      <td style="padding:8px 10px;border-bottom:1px solid #eee">${formatDate(a.date)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center">${a.present ? '✅ Был на занятии' : '❌ Пропустил'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #eee;color:#888">${a.note ? esc(a.note) : '—'}</td>
    </tr>`).join('');

  const hwListHtml = s.homework.map(h => `
    <tr>
      <td style="padding:8px 10px;border-bottom:1px solid #eee">${esc(h.text)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center">${h.status === 'done' ? '✅ Выполнено' : (h.due && h.due < today ? '⚠️ Просрочено' : '⏳ Не сдано')}</td>
      <td style="padding:8px 10px;border-bottom:1px solid #eee;text-align:center;color:#888">${h.due ? formatDate(h.due) : '—'}</td>
    </tr>`).join('');

  const mistakesHtml = (s.mistakes || []).map(m => `<li style="margin-bottom:6px">${esc(m.text)} <span style="color:#999;font-size:12px">(${formatDate(m.date)})</span></li>`).join('');

  const reportHtml = `<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Отчёт — ${esc(s.name)}</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; color:#3a2030; max-width:760px; margin:0 auto; padding:32px 24px; }
  h1 { font-size:22px; margin-bottom:2px; }
  .sub { color:#888; font-size:13px; margin-bottom:24px; }
  .stats { display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .stat { flex:1; min-width:140px; background:#FBEEF4; border-radius:10px; padding:14px 16px; }
  .stat .label { font-size:11px; color:#A0576E; text-transform:uppercase; font-weight:600; letter-spacing:.04em; }
  .stat .value { font-size:22px; font-weight:800; margin-top:4px; }
  h2 { font-size:16px; margin:28px 0 10px; border-bottom:2px solid #F2E3EB; padding-bottom:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; text-transform:uppercase; color:#999; padding:6px 10px; }
  ul { font-size:13px; padding-left:20px; }
  .footer { margin-top:32px; font-size:12px; color:#aaa; text-align:center; }
  @media print { body { padding:0 8px; } }
</style></head>
<body>
  <h1>Отчёт об успеваемости — ${esc(s.name)}</h1>
  <div class="sub">${esc(s.subject)} · сформировано ${formatDate(today)}</div>

  <div class="stats">
    <div class="stat"><div class="label">Темы пройдены</div><div class="value">${topicsDone}/${topicsTotal}</div></div>
    <div class="stat"><div class="label">Посещаемость</div><div class="value">${attPresent}/${pastAtt.length}</div></div>
    <div class="stat"><div class="label">ДЗ выполнено</div><div class="value">${hwDone}/${hwTotal}</div></div>
    ${unpaidSum > 0 ? `<div class="stat" style="background:#FCF1F1"><div class="label" style="color:#C2548A">Задолженность</div><div class="value" style="color:#E08A8A">${unpaidSum.toLocaleString('ru-RU')} ₽</div></div>` : ''}
  </div>

  <h2>Программа обучения</h2>
  <table><tr><th>Тема</th><th>Статус</th><th>Дата</th></tr>${topicsListHtml || '<tr><td colspan="3" style="color:#999;padding:8px 10px">Темы пока не добавлены</td></tr>'}</table>

  <h2>Посещаемость</h2>
  <table><tr><th>Дата</th><th>Статус</th><th>Заметка</th></tr>${attListHtml || '<tr><td colspan="3" style="color:#999;padding:8px 10px">Записей пока нет</td></tr>'}</table>

  <h2>Домашние задания</h2>
  <table><tr><th>Задание</th><th>Статус</th><th>Срок</th></tr>${hwListHtml || '<tr><td colspan="3" style="color:#999;padding:8px 10px">Заданий пока нет</td></tr>'}</table>

  ${(s.mistakes || []).length ? `<h2>На что обратить внимание</h2><ul>${mistakesHtml}</ul>` : ''}

  <div class="footer">Отчёт сформирован автоматически в журнале репетитора</div>
</body></html>`;

  const blob = new Blob([reportHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Отчёт — ${s.name} — ${formatDate(today)}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function getActive() { return state.students.find(x => x.id === state.activeId); }
function initials(name) {
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

document.getElementById('studentModal').addEventListener('click', function(e) {
  if (e.target === this) closeStudentModal();
});
